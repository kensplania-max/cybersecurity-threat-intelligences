<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Cybersecurity Threat Intelligence</title>
</head>

<body>

    <h1>Cybersecurity Threat Intelligence Dashboard</h1>

    <p>Enter an IP address to check its threat information.</p>

    <input
        type="text"
        id="ipInput"
        placeholder="Enter IP Address"
    >

    <button onclick="checkIP()">Check IP</button>

    <div id="result">
        <h2>Threat Information</h2>

        <p id="status">No IP checked yet.</p>

        <!-- Dashboard Cards -->
        <div class="card">
            <h3>IP Address</h3>
            <p id="ipResult">---</p>
        </div>

        <div class="card">
            <h3>Status</h3>
            <p id="statusResult">---</p>
        </div>

        <div class="card">
            <h3>Threat Level</h3>
            <p id="threatResult">---</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
